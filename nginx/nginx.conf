events {}

http {
    # Round-robin entre as N instancias stateless da API. max_fails/fail_timeout
    # dao um failover passivo simples: se uma instancia parar de responder, o
    # Nginx para de mandar trafego pra ela por um tempo sem precisar de um
    # health check ativo (recurso do Nginx Plus, nao da versao open source).
    upstream api_backend {
        server api1:8000 max_fails=3 fail_timeout=5s;
        server api2:8000 max_fails=3 fail_timeout=5s;
        server api3:8000 max_fails=3 fail_timeout=5s;
    }

    server {
        listen 80;

        location / {
            proxy_pass http://api_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_next_upstream error timeout http_502 http_503 http_504;
        }
    }
}
