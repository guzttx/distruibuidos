<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Catálogo de Produtos</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="topbar">
      <div>
        <h1>Catálogo de Produtos</h1>
        <p>CRUD acadêmico com frontend puro consumindo uma API FastAPI.</p>
      </div>
      <span id="status-api" class="status">verificando API...</span>
    </header>

    <main class="layout">
      <section class="panel form-panel" aria-labelledby="form-title">
        <h2 id="form-title">Cadastrar produto</h2>
        <form id="produto-form">
          <input type="hidden" id="produto-id" />

          <label>
            Nome
            <input id="nome" name="nome" type="text" required maxlength="150" />
          </label>

          <label>
            Categoria
            <select id="categoria" name="categoria" required>
              <option value="">Selecione</option>
              <option>Eletronicos</option>
              <option>Informatica</option>
              <option>Casa</option>
              <option>Moveis</option>
              <option>Esportes</option>
              <option>Livros</option>
              <option>Vestuario</option>
              <option>Automotivo</option>
            </select>
          </label>

          <div class="field-row">
            <label>
              Preço
              <input id="preco" name="preco" type="number" min="0" step="0.01" required />
            </label>

            <label>
              Estoque
              <input id="estoque" name="estoque" type="number" min="0" step="1" required />
            </label>
          </div>

          <label>
            Descrição
            <textarea id="descricao" name="descricao" rows="4"></textarea>
          </label>

          <div class="actions">
            <button type="submit" id="submit-button">Salvar</button>
            <button type="button" id="cancel-button" class="secondary" hidden>Cancelar edição</button>
          </div>
        </form>
      </section>

      <section class="panel table-panel" aria-labelledby="table-title">
        <div class="table-header">
          <div>
            <h2 id="table-title">Produtos</h2>
            <p id="total-info">Nenhum produto carregado.</p>
          </div>
          <button type="button" id="reload-button" class="secondary">Recarregar</button>
        </div>

        <form id="filter-form" class="filters">
          <label>
            Categoria
            <select id="filtro-categoria">
              <option value="">Todas</option>
              <option>Eletronicos</option>
              <option>Informatica</option>
              <option>Casa</option>
              <option>Moveis</option>
              <option>Esportes</option>
              <option>Livros</option>
              <option>Vestuario</option>
              <option>Automotivo</option>
            </select>
          </label>

          <label>
            Preço mínimo
            <input id="preco-min" type="number" min="0" step="0.01" />
          </label>

          <label>
            Preço máximo
            <input id="preco-max" type="number" min="0" step="0.01" />
          </label>

          <button type="submit">Filtrar</button>
          <button type="button" id="clear-filter-button" class="secondary">Limpar</button>
        </form>

        <div id="message" class="message" role="status"></div>

        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>ID</th>
                <th>Nome</th>
                <th>Categoria</th>
                <th>Preço</th>
                <th>Estoque</th>
                <th>Ações</th>
              </tr>
            </thead>
            <tbody id="produtos-tbody"></tbody>
          </table>
        </div>

        <nav class="pagination" aria-label="Paginação de produtos">
          <button type="button" id="prev-page" class="secondary">Anterior</button>
          <span id="page-info">Página 1</span>
          <button type="button" id="next-page" class="secondary">Próxima</button>
        </nav>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
